spring:
  application:
    name: gateway

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motori_gateway}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:toor}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/motori_realm/protocol/openid-connect/certs
        audiences: 
            - account
            - motori-backoffice

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:5173"
                allowed-methods: GET, POST, PUT, DELETE, OPTIONS, PATCH
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            # ── Swagger routes ──
            - id: product-service-swagger
              uri: lb://product-service
              predicates:
                - Path=/api/products/swagger-ui/**,/api/products/api-docs/**,/api/products/webjars/**
              filters:
                - RewritePath=/api/products/(?<segment>.*), /$\{segment}

            # ── Specific product-service routes (must be before generic) ──
            - id: product-part-brands-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/part-brands
              filters:
                - RewritePath=/api/products/part-brands, /api/part-brands

            - id: product-part-brands-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/part-brands/**
              filters:
                - RewritePath=/api/products/part-brands/(?<segment>.*), /api/part-brands/$\{segment}

            - id: product-equipement-brands-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/equipement-brands
              filters:
                - RewritePath=/api/products/equipement-brands, /api/equipement-brands

            - id: product-equipement-brands-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/equipement-brands/**
              filters:
                - RewritePath=/api/products/equipement-brands/(?<segment>.*), /api/equipement-brands/$\{segment}

            - id: product-part-categories-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/part-categories
              filters:
                - RewritePath=/api/products/part-categories, /api/part-categories

            - id: product-part-categories-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/part-categories/**
              filters:
                - RewritePath=/api/products/part-categories/(?<segment>.*), /api/part-categories/$\{segment}

            - id: product-equipement-categories-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/equipement-categories
              filters:
                - RewritePath=/api/products/equipement-categories, /api/equipement-categories

            - id: product-equipement-categories-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/equipement-categories/**
              filters:
                - RewritePath=/api/products/equipement-categories/(?<segment>.*), /api/equipement-categories/$\{segment}

            - id: product-vehicule-brands-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/vehicule-brands
              filters:
                - RewritePath=/api/products/vehicule-brands, /api/vehicule-brands

            - id: product-vehicule-brands-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/vehicule-brands/**
              filters:
                - RewritePath=/api/products/vehicule-brands/(?<segment>.*), /api/vehicule-brands/$\{segment}

            - id: product-vehicules-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/vehicules
              filters:
                - RewritePath=/api/products/vehicules, /api/vehicules

            - id: product-vehicules-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/vehicules/**
              filters:
                - RewritePath=/api/products/vehicules/(?<segment>.*), /api/vehicules/$\{segment}

            - id: product-parts-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/parts
              filters:
                - RewritePath=/api/products/parts, /api/parts

            - id: product-parts-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/parts/**
              filters:
                - RewritePath=/api/products/parts/(?<segment>.*), /api/parts/$\{segment}

            - id: product-equipements-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/equipements
              filters:
                - RewritePath=/api/products/equipements, /api/equipements

            - id: product-equipements-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/equipements/**
              filters:
                - RewritePath=/api/products/equipements/(?<segment>.*), /api/equipements/$\{segment}

            - id: product-inventories-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/inventories
              filters:
                - RewritePath=/api/products/inventories, /api/inventories

            - id: product-inventories-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/inventories/**
              filters:
                - RewritePath=/api/products/inventories/(?<segment>.*), /api/inventories/$\{segment}

            - id: product-compatibilities-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/compatibilities
              filters:
                - RewritePath=/api/products/compatibilities, /api/compatibilities

            - id: product-compatibilities-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/compatibilities/**
              filters:
                - RewritePath=/api/products/compatibilities/(?<segment>.*), /api/compatibilities/$\{segment}
            # Orders via product-service (X-User-Id header required for creation)
            - id: product-orders-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/orders
              filters:
                - RewritePath=/api/products/orders, /api/orders

            - id: product-orders-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/orders/**
              filters:
                - RewritePath=/api/products/orders/(?<segment>.*), /api/orders/$\{segment}
            # ── Auth service ──
            - id: auth-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            # ── User service ──
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            # ── Backoffice service ──
            - id: backoffice-orders-route
              uri: lb://backoffice-service
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=0

            - id: backoffice-statistics-route
              uri: lb://backoffice-service
              predicates:
                - Path=/api/statistics/**
              filters:
                - StripPrefix=0

            # ── Payment service ──
            - id: payment-service-route
              uri: lb://payment-service
              predicates:
                - Path=/api/payments/**
              filters:
                - StripPrefix=0

            # ── Actuator routes ──
            - id: user-service-actuator-route
              uri: lb://user-service
              predicates:
                - Path=/api/user-service/actuator/**
              filters:
                - StripPrefix=2

            - id: product-service-actuator-route
              uri: lb://product-service
              predicates:
                - Path=/api/product-service/actuator/**
              filters:
                - RewritePath=/api/product-service/actuator/(?<segment>.*), /actuator/$\{segment}



server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      access: UNRESTRICTED
    routes:
      enabled: true

keycloak:
  auth-server-url: http://localhost:8082
  realm: motori_realm
  client-secret: ${KEYCLOAK_SECRET_KEY:}
  enabled: true

gateway:
  security:
    jwt-validation-enabled: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    com.motori.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.security.oauth2.jwt: DEBUG
    org.springframework.security.oauth2.server.resource: DEBUG