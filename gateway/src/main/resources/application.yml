spring:
  application:
    name: gateway

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/motori_gateway}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "http://localhost:5173"
                allowed-methods: GET, POST, PUT, DELETE, OPTIONS, PATCH
                allowed-headers: "*"
                allow-credentials: true
                max-age: 3600
          routes:
            # Route pour Swagger
            - id: product-service-swagger
              uri: lb://product-service
              predicates:
                - Path=/api/products/swagger-ui/**,/api/products/api-docs/**,/api/products/webjars/**
              filters:
                - RewritePath=/api/products/(?<segment>.*), /$\{segment}

            # Route pour l'API
            - id: product-service-api
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - RewritePath=/api/products/(?<segment>.*), /api/parts/$\{segment}
            - id: auth-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/auth/**
              filters:
                - StripPrefix=1

            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/users/**
              filters:
                - StripPrefix=1

            - id: user-service-actuator-route
              uri: lb://user-service
              predicates:
                - Path=/api/user-service/actuator/**
              filters:
                - StripPrefix=2

            - id: gateway-logs-route
              uri: http://localhost:8080
              predicates:
                - Path=/api/gateway/logs/**
              filters:
                - StripPrefix=2

            - id: eureka-service-route
              uri: http://localhost:8761
              predicates:
                - Path=/api/eureka/**
              filters:
                - StripPrefix=1

            - id: product-service-webjars
              uri: lb://product-service
              predicates:
                - Path=/api/products/webjars/**
              filters:
                - RewritePath=/api/products/(?<segment>.*), /$\{segment}

            - id: product-service-swagger-ui
              uri: lb://product-service
              predicates:
                - Path=/api/products/swagger-ui/**
              filters:
                - RewritePath=/api/products/swagger-ui/(?<segment>.*), /swagger-ui/$\{segment}

            - id: product-service-api-docs
              uri: lb://product-service
              predicates:
                - Path=/api/products/api-docs/**
              filters:
                - RewritePath=/api/products/api-docs/(?<segment>.*), /api-docs/$\{segment}

            - id: product-service-api-docs-root
              uri: lb://product-service
              predicates:
                - Path=/api/products/api-docs
              filters:
                - RewritePath=/api/products/api-docs, /api-docs

            - id: product-service-route
              uri: lb://product-service
              predicates:
                - Path=/api/products/**
              filters:
                - RewritePath=/api/products/(?<segment>.*), /api/parts/$\{segment}

            - id: product-service-actuator-route
              uri: lb://product-service
              predicates:
                - Path=/api/product-service/actuator/**
              filters:
                - RewritePath=/api/product-service/actuator/(?<segment>.*), /actuator/$\{segment}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8082/realms/motori

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,routes
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    gateway:
      access: UNRESTRICTED
    routes:
      enabled: true

keycloak:
  auth-server-url: http://localhost:8082
  realm: motori_realm
  client-secret: ${KEYCLOAK_SECRET_KEY:}
  enabled: true

gateway:
  security:
    jwt-validation-enabled: true

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    com.motori.gateway: DEBUG
    reactor.netty: DEBUG