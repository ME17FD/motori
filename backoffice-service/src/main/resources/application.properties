spring.application.name=backoffice-service
server.port=8084

# Database (same as product-service: motori_products)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/motori_products}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:toor}
spring.datasource.driver-class-name=org.postgresql.Driver

# validate = ne pas modifier le schéma (DB partagée avec product-service, tables déjà en UUID)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=localhost
eureka.instance.instance-id=${spring.application.name}:${server.port}

# OAuth2 Resource Server (Keycloak JWT) - for protected endpoints
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8082/realms/motori_realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/motori_realm/protocol/openid-connect/certs
# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator (health, info for monitoring)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
